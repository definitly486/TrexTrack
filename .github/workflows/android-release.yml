name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example v1.0.0); leave empty to use the current commit"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.TREXTRACK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TREXTRACK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TREXTRACK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TREXTRACK_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "No release keystore configured; building an unsigned release APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trextrack-release.jks"
          {
            echo "ORG_GRADLE_PROJECT_TREXTRACK_STORE_FILE=$RUNNER_TEMP/trextrack-release.jks"
            echo "ORG_GRADLE_PROJECT_TREXTRACK_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_TREXTRACK_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_TREXTRACK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          JAVA_TOOL_OPTIONS: -Dos.name=Linux

      - name: Prepare release files
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" ]]; then
            VERSION="main-${GITHUB_RUN_NUMBER}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag_name }}"
            if [[ -z "$VERSION" ]]; then VERSION="manual-${GITHUB_RUN_NUMBER}"; fi
          fi
          VERSION="${VERSION//\//-}"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-androidTest*' | head -n1)"
          if [[ -z "$APK" ]]; then
            echo "Release APK not found"
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          OUT="TrexTrack-${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk=$APK"
          ls -lh "$OUT"
          if ! jarsigner -verify "$OUT" >/dev/null 2>&1; then
            echo "::warning::APK is not signed. Configure TREXTRACK_KEYSTORE_BASE64, TREXTRACK_STORE_PASSWORD, TREXTRACK_KEY_ALIAS and TREXTRACK_KEY_PASSWORD repository secrets for signed installable updates."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TrexTrack ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            TrexTrack Android release.

            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            APK: download the attached `TrexTrack-${{ steps.meta.outputs.tag }}.apk`.
          files: ${{ steps.meta.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
